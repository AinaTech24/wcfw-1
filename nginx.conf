# Nginx config for wcfw.in on Hostinger VPS
# Place at: /etc/nginx/sites-available/wcfw
# Then: sudo ln -s /etc/nginx/sites-available/wcfw /etc/nginx/sites-enabled/
# Run:  sudo certbot --nginx -d wcfw.in -d www.wcfw.in

server {
    listen 80;
    server_name wcfw.in www.wcfw.in;
    return 301 https://www.wcfw.in$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.wcfw.in;

    # SSL — certbot will fill these in
    ssl_certificate     /etc/letsencrypt/live/www.wcfw.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.wcfw.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # React build (frontend)
    root /var/www/wcfw/build;
    index index.html;

    # Cache static assets aggressively
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API → Node.js backend on port 5001
    location /api/ {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10M;
    }

    # Sitemap → backend
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:5001/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router — all unknown paths → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
